name: deploy

# Deploys the Function app on push to main using OIDC federated credentials
# (no publish-profile secret stored). Set AZURE_FUNCTIONAPP_NAME below and add
# the AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID repo secrets.
# See the README "Deployment" section for the one-time Azure setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC azure/login
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: REPLACE_WITH_YOUR_FUNCTION_APP_NAME
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: .
          # Let Azure (Oryx) restore requirements.txt during deployment.
          scm-do-build-during-deployment: true
          enable-oryx-build: true
